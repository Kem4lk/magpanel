[platformio]
default_envs = esp32-s3-ota

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi   ; PSRAM erisim modu
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; board_build.partitions = partitions_custom_8mb.csv
build_flags = -DFM_APPLY_CIE=1  ; sRGB gamma duzeltmesi
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-DFM_FLIP_Y_IN_HALF=1  ; diyagonal testiyle dogrulandi (v14)
	-DFM_CHAIN_REVERSE=1   ; panel-kimlik testiyle dogrulandi: kablo sirasi ters (mavi/yesil/kirmizi cikti)
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM                       ; 8MB PSRAM'i etkinlestir (RAM darligini cozer)
	-DCONFIG_SPIRAM_USE_MALLOC=1            ; malloc PSRAM'i de kullanabilsin
	-DCONFIG_ESP32S3_SPIRAM_SUPPORT=1

lib_deps =
	https://github.com/mrcodetastic/GFX_Lite
	ESP32Async/AsyncTCP @ ^3.3.2
	ESP32Async/ESPAsyncWebServer @ ^3.6.0

framework = arduino
; P4 (FM6363C) ana firmware'i: P1.86 test firmware'ini derlemez
build_src_filter = +<*> -<p186_test.cpp>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
check_skip_packages = yes
; WiFi uzerinden yukleme: PlatformIO'da env olarak "esp32-s3-ota" sec.
; Ilk yukleme USB ile yapilmis olmali; sonrasi tamamen kablosuz.
[env:esp32-s3-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = 192.168.1.33      ; mDNS calismazsa paneldeki IP'yi yaz
upload_flags = --auth=magpanel    ; wifi_config.h'daki OTA_PASSWORD ile ayni

; ---------------------------------------------------------------------------
; P1.86 172x86 (SM16380SH + SM5368) ANA MagPanel firmware'i: ayni main.cpp,
; -DPANEL_P186 ile PanelSM16380 surucusu (include/panel.h). Web UI, galeri,
; uygulamalar, flicker testi, OTA hepsi var. GitHub OTA "firmware-p186.bin"
; dosyasini ceker (P4 cihazlari "firmware.bin" almaya devam eder).
;   USB:  pio run -e p186 -t upload
;   OTA:  pio run -e p186-ota -t upload   (upload_port = panelin IP'si)
[env:p186]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags}
	-DPANEL_P186

[env:p186-ota]
extends = env:esp32-s3-ota
build_flags = ${env:esp32-s3-devkitc-1.build_flags}
	-DPANEL_P186

; ---------------------------------------------------------------------------
; P1.86 172x86 (SM16380SH + SM5368) TEST firmware'i. P4 env'leri degismedi;
; P4'e donmek icin o env'i flash'la ya da bu firmware'in /update sayfasindan
; P4 firmware.bin'i yukle. Kalibrasyon/teshis icin (desenler, register profili, eslem).
;   USB:  pio run -e p186-test -t upload
;   OTA:  pio run -e p186-test-ota -t upload
[env:p186-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = +<*> -<main.cpp>

[env:p186-test-ota]
extends = env:esp32-s3-ota
build_src_filter = +<*> -<main.cpp>
